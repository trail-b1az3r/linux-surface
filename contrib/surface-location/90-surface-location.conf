# GeoClue settings for Surface devices.
# Install to: /etc/geoclue/conf.d/90-surface-location.conf
# (surface-location-setup.sh --fix does this; it removes the [modem-gps]
#  lines' "false" on LTE models that have a GPS receiver.)

# Wi-Fi positioning: nearby access points are looked up in beaconDB, an
# open, opt-in replacement for the retired Mozilla Location Service.
# Accuracy is typically tens of metres in towns, worse in the countryside.
# Needs NetworkManager with wpa_supplicant (GeoClue can't scan via iwd).
[wifi]
enable=true
url=https://api.beacondb.net/v1/geolocate

# Cell tower positioning (LTE model with a SIM): same lookup service.
[3g]
enable=true

# Satellite GPS/GLONASS through ModemManager. Only the Surface Pro 5 LTE
# (model 1807) has a receiver; the Wi-Fi model (1796) does not.
[modem-gps]
enable=false

[cdma]
enable=false

# Allows the command line test (surface-location-setup.sh --test) to get a
# location without a desktop agent asking for permission.
[geoclue-where-am-i]
allowed=true
system=false
users=
